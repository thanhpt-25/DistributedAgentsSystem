# DAS Console: static files plus a same-origin proxy to the Gateway, so the browser needs no CORS and the
# API key only ever travels to this origin. SSE (/v1/requests/{id}/events) needs buffering off and a long read timeout.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Scripts and styles only from this origin (Google Fonts for type); API calls only to this origin. No inline script.
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location / {
    try_files $uri /index.html;
  }

  # Docker's embedded DNS. Resolving at request time (a variable in proxy_pass) lets nginx start before the Gateway
  # exists and survive its restarts, instead of exiting with "host not found in upstream".
  resolver 127.0.0.11 valid=10s;
  set $gateway http://gateway:8080;

  location /v1/ {
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location = /healthz {
    proxy_pass $gateway;
    proxy_set_header Host $host;
  }
}
