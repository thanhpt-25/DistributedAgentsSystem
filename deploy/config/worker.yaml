# Worker_Agent sample Agent_Config (mounted at /etc/das/config.yaml).
# One file and one image serve every worker service; Capabilities come from
# DAS__WORKER__CAPABILITIES so each Compose service declares a different set.
#
# Supplied by the environment (see deploy/docker-compose.yml and .env.example):
#   DAS__WORKER__CAPABILITIES      comma-separated, e.g. research,summarize
#   DAS__RABBITMQ__URL             amqp://<user>:<pass>@<host>:5672/
#   DAS__REDIS__URL                redis://<host>:6379/0
#   DAS__GRPC__ADVERTISE_HOST      this container's reachable host name (per replica)
#   DAS__LLM__PROVIDER, DAS__LLM__MODEL, and DAS__LLM__API_KEY or DAS__LLM__BASE_URL
role: worker
health_port: 8081

transports:
  jobs: rabbitmq
  control: grpc

grpc:
  bind: "0.0.0.0:50051"
  advertise_port: 50051

worker:
  concurrency_limit: 4

llm:
  temperature: 0.2
  max_output_tokens: 4096
  timeout: 60
  retry_count: 3

limits:
  job_timeout: 300
  heartbeat_interval: 5
  # Keep below stop_grace_period in docker-compose.yml.
  shutdown_timeout: 30
  startup_timeout: 60
  startup_retry_interval: 2
