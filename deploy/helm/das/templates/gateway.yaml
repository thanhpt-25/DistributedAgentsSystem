apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "das.fullname" . }}-gateway
  labels:
    {{- include "das.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "das.selectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "das.componentLabels" (dict "root" . "component" "gateway") | nindent 8 }}
      annotations:
        checksum/config: {{ include "das.config" (dict "root" . "role" "gateway") | sha256sum }}
    spec:
      {{- include "das.podSpec" (dict "root" . "role" "gateway" "component" "gateway" "resources" .Values.gateway.resources) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "das.fullname" . }}-gateway
  labels:
    {{- include "das.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "das.selectorLabels" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
