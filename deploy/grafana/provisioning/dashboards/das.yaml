# Grafana dashboard provider: loads deploy/grafana/dashboards/*.json at startup
# (mounted at /var/lib/grafana/dashboards, Requirement 18.5).
apiVersion: 1

providers:
  - name: das
    orgId: 1
    folder: DAS
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
