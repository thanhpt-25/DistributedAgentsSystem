# Redis for the kind cluster tests: one instance, no replication (v2 Req 20.7 is unchanged). Not part of the chart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: das
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.4
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: das
spec:
  selector: {app: redis}
  ports:
    - port: 6379
