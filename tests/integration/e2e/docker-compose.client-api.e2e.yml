# Test-only override for the client API end-to-end tests (das-client-api task 11.1). Used as:
#
#   docker compose --project-directory deploy -p das-e2e-client \
#     -f deploy/docker-compose.yml \
#     -f tests/integration/e2e/docker-compose.e2e.yml \
#     -f tests/integration/e2e/docker-compose.client-api.e2e.yml ...
#
# Relative paths, `extends.file` included, resolve against the project directory (deploy/). It is layered on
# docker-compose.e2e.yml, which already supplies the fake LLM and the shorter Manager lease; nothing from that
# file is repeated here. It adds:
#
#   gateway-b     a second Gateway replica on its own host port, to show that the rate limit is shared. It extends
#                 `gateway`, so it has the same image, healthcheck and environment, and reuses the image that
#                 `gateway` builds.
#   webhook-sink  the webhook receiver (webhook_sink.py): it fails the first two deliveries of each id, verifies
#                 every signature, and records what it saw (GET /received).
#
# Both Gateways read the e2e Gateway config (gateway.client-api.yaml) instead of deploy/config/gateway.yaml. The
# secrets below are placeholders for a throw-away stack.
#
# Compose appends list entries when files are merged. `volumes` and `ports` are therefore replaced with `!override`
# (Compose 2.24 or later): appended, the production config would stay mounted and the base host port would be
# published a second time.
services:
  gateway:
    environment:
      DAS__WEBHOOK_SECRETS__E2E: e2e-webhook-secret-0123456789
    volumes: !override
      - ../tests/integration/e2e/gateway.client-api.yaml:/etc/das/config.yaml:ro
    depends_on:
      webhook-sink:
        condition: service_healthy

  gateway-b:
    extends:
      file: docker-compose.yml
      service: gateway
    build: !reset null
    ports: !override
      - "${DAS_GATEWAY_B_PORT}:8080"
    environment:
      DAS__WEBHOOK_SECRETS__E2E: e2e-webhook-secret-0123456789
    volumes: !override
      - ../tests/integration/e2e/gateway.client-api.yaml:/etc/das/config.yaml:ro
    depends_on:
      webhook-sink:
        condition: service_healthy

  webhook-sink:
    image: python:3.12-slim
    command: ["python", "-u", "/sink/webhook_sink.py"]
    environment:
      SINK_SECRET: e2e-webhook-secret-0123456789
      SINK_PORT: "8099"
    volumes:
      - ../tests/integration/e2e/webhook_sink.py:/sink/webhook_sink.py:ro
    ports:
      - "127.0.0.1:${DAS_E2E_SINK_PORT}:8099"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [das]
